name: Linux build deps
description: >
  Install the GTK / WebKitGTK system libraries Tauri needs to build on Linux,
  plus (optionally) xvfb for headless GUI tests. Centralises the package list so
  every job stays in sync from one place.

inputs:
  xvfb:
    description: Also install xvfb (for launching the app headless)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The runner's Azure Ubuntu mirror sometimes crawls (2026-10-26/27: ~100 KB/s, so the
    # ~150 MB of WebKitGTK packages took longer than the job), and every Linux job downloaded
    # the same packages again. Cache the .deb files: after one good download a job only needs
    # `apt-get update` plus local installs.
    - name: Package list
      id: pkgs
      shell: bash
      run: |
        pkgs="libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev"
        if [ "${{ inputs.xvfb }}" = "true" ]; then
          pkgs="$pkgs xvfb"
        fi
        echo "list=$pkgs" >> "$GITHUB_OUTPUT"
        echo "key=$(printf '%s' "$pkgs" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/apt-debs" >> "$GITHUB_OUTPUT"
        # The runner image identity (machine env vars — not in the expression `env` context).
        echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
        echo "image_version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore cached packages
      id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.pkgs.outputs.dir }}
        # The image version changes weekly; the prefix still restores last week's .debs, and
        # apt only downloads what changed.
        key: linux-deps-${{ runner.arch }}-${{ steps.pkgs.outputs.image }}-${{ steps.pkgs.outputs.key }}-${{ steps.pkgs.outputs.image_version }}
        restore-keys: |
          linux-deps-${{ runner.arch }}-${{ steps.pkgs.outputs.image }}-${{ steps.pkgs.outputs.key }}-

    - name: Install Tauri system dependencies
      shell: bash
      env:
        PKGS: ${{ steps.pkgs.outputs.list }}
        DEBS: ${{ steps.pkgs.outputs.dir }}
      run: |
        set -uo pipefail
        mkdir -p "$DEBS/partial"
        # Downloads land in (and are kept in) the cached directory; retries resume from what
        # earlier attempts already fetched.
        opts=(-o "Dir::Cache::Archives=$DEBS" -o APT::Keep-Downloaded-Packages=true
              -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
        # The runner's sources go through a mirror list (mirror+file:/etc/apt/apt-mirrors.txt);
        # the fallback rewrites both it and any plain source lines.
        use_archive() {
          echo "::warning::switching from the runner's apt mirror to archive.ubuntu.com"
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
          done
        }
        # Attempt 1 gets most of the budget: a slow-but-moving download must not be killed
        # (that only re-runs the same transfer). Attempt 2 switches mirror.
        for limit in 900 420; do
          [ "$limit" = 420 ] && use_archive
          # shellcheck disable=SC2086
          if sudo timeout 180 apt-get "${opts[@]}" update \
            && sudo timeout "$limit" apt-get "${opts[@]}" install -y $PKGS; then
            sudo chown -R "$(id -u):$(id -g)" "$DEBS"
            echo "installed; $(find "$DEBS" -maxdepth 1 -name '*.deb' | wc -l) .deb files cached"
            exit 0
          fi
          echo "::warning::apt attempt (limit ${limit}s) failed or timed out"
          # A timeout can land mid-dpkg; finish any half-configured packages before retrying.
          sudo dpkg --configure -a || true
        done
        echo "::error::could not install the Tauri system dependencies"
        exit 1

    - name: Save package cache
      if: steps.restore.outputs.cache-hit != 'true'
      continue-on-error: true # several jobs race to save the same key; one wins
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.pkgs.outputs.dir }}
        key: linux-deps-${{ runner.arch }}-${{ steps.pkgs.outputs.image }}-${{ steps.pkgs.outputs.key }}-${{ steps.pkgs.outputs.image_version }}
