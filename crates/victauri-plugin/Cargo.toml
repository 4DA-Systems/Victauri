[package]
name = "victauri-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri plugin for Victauri — embedded MCP server with full-stack introspection"
authors.workspace = true
rust-version.workspace = true
links = "tauri-plugin-victauri"
keywords = ["tauri", "mcp", "plugin", "testing", "ai-agent"]
categories = ["development-tools::testing", "gui"]
homepage = "https://github.com/4DA-Systems/victauri"
documentation = "https://docs.rs/victauri-plugin"
readme = "README.md"
exclude = ["tests/"]

[package.metadata.docs.rs]
# Not `all-features`: `tauri-v3` must match the resolved `tauri` major. docs.rs builds with the
# Cargo.lock packaged in the crate (it only regenerates an invalid one), which pins Tauri 2.
features = ["sqlite", "bundled-sqlite"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
victauri-core = { workspace = true, features = ["schema", "middleware"] }
victauri-macros = { workspace = true }
# Tauri 2 OR Tauri 3 — whichever the app itself depends on. `tauri` declares `links = "Tauri"`, so
# a build can hold exactly one, and cargo unifies this range onto the app's own tauri (the same
# trick as the rusqlite range below). No runtime feature (`wry`) is requested: the plugin is generic
# over `R: Runtime`, and on Tauri 3 the runtime is chosen by the app (`Builder::runtime`), not by a
# `tauri` feature. On Tauri 3 also enable this crate's `tauri-v3` feature (see [features]).
# A crate depending on this one without a `tauri` dependency of its own gets the newest version
# the range admits — a Tauri 3 pre-release — so always depend on `tauri` directly (apps do).
#
# The upper bound is the newest Tauri 3 pre-release this crate has been built against; widen it
# together with the `tauri3` CI job (`NEWEST` there) — pre-releases only match a comparator that
# names the same major.minor.patch, so `<4` alone would NOT admit `3.0.0-alpha.*`.
tauri = { version = ">=2.0.0, <=3.0.0-alpha.5", default-features = false }
rmcp = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Backend log capture: the `log_layer()` tracing layer (registry only — no fmt/env-filter)
# and the `log` crate adapter. Both are already in every Tauri app's dependency graph.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
log = { version = "0.4", features = ["std"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
raw-window-handle = "0.6"
base64 = "0.22"
regex = "1"
url = { workspace = true }
flate2 = "1"
tower = { version = "0.5.3", features = ["limit"] }
# Serve loop with a header-read timer and a connection cap (axum::serve sets neither).
hyper = { version = "1.9", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio", "service", "http1"] }
rusqlite = { workspace = true, optional = true }

[features]
default = ["sqlite", "bundled-sqlite"]
# `query_db` / `introspect db_health`.
sqlite = ["dep:rusqlite"]
# Compile SQLite into the binary (rusqlite `bundled`). Because cargo unifies the plugin's
# rusqlite with the app's, this also switches the APP's rusqlite to bundled SQLite. An app that
# links a system SQLite or SQLCipher keeps its own with
# `default-features = false, features = ["sqlite"]`.
bundled-sqlite = ["sqlite", "rusqlite?/bundled"]
# Build against Tauri 3 (the app depends on `tauri = "3"`). Selects Tauri 3's
# `initialization_script` (renamed from `js_init_script`) and the Tauri 3 permission build step;
# the rest of the code compiles unchanged on both majors. Leaving it off with a Tauri 3 app (or
# turning it on with a Tauri 2 app) fails to build, with a message naming the fix — a single
# build can only ever link one `tauri`.
tauri-v3 = ["dep:tauri-plugin-v3"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
# The Tauri 3 permission generator, used by build.rs only under `tauri-v3`. A build-dependency
# with no `links`, so it can sit in the lockfile beside `tauri-plugin` 2.
tauri-plugin-v3 = { package = "tauri-plugin", version = "=3.0.0-alpha.4", features = ["build"], optional = true }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
uuid = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
proptest = "1"
# Proves the tauri-plugin-log recipe: TargetKind::Dispatch(fern::Dispatch::new().chain(log_logger())).
fern = "0.7"
# Proves the documented tracing recipes (registry + EnvFilter + fmt, and fmt().finish().with(..)).
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["composite"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    # Windows.Graphics.Capture screenshot path (WGC/DXGI — captures transparent
    # and GPU-composited windows that PrintWindow/BitBlt return blank for).
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Storage_Xps",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_WindowsProgramming",
    # Owner-only discovery-dir ACLs (audit round-4 #4): token user SID + protected DACL.
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[lints]
workspace = true
