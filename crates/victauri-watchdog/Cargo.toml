[package]
name = "victauri-watchdog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightweight crash-recovery sidecar for Victauri MCP server"
authors.workspace = true
rust-version.workspace = true
keywords = ["tauri", "mcp", "watchdog", "health-check", "monitoring"]
categories = ["development-tools::testing"]
homepage = "https://github.com/4DA-Systems/victauri"
documentation = "https://docs.rs/victauri-watchdog"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "victauri-watchdog"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Process liveness + owner check (`process.rs`), instead of spawning tasklist.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
