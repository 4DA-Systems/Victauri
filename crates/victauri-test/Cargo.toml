[package]
name = "victauri-test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Test assertion helpers for Victauri-powered Tauri app testing"
authors.workspace = true
rust-version.workspace = true
keywords = ["tauri", "mcp", "testing", "assertions", "integration-test"]
categories = ["development-tools::testing"]
homepage = "https://github.com/4DA-Systems/victauri"
documentation = "https://docs.rs/victauri-test"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
png = "0.17"
base64 = "0.22"
# Unpredictable names for the UID-probe files created in the shared temp dir (R4-DISC2).
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Process liveness + owner check for discovery (`process.rs`), instead of spawning tasklist.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
axum = { workspace = true }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true }
tempfile = "3"

[lints]
workspace = true
