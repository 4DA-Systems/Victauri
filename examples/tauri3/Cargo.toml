# The demo app (`examples/demo-app/src/main.rs`, compiled as-is) built against Tauri 3 with
# victauri-plugin's `tauri-v3` feature. It is its OWN workspace with its own lockfile: `tauri`
# declares `links = "Tauri"`, so Tauri 2 (the main workspace) and Tauri 3 can never share one
# resolve. CI job `tauri3` builds it; run it locally with
#   cargo run --manifest-path examples/tauri3/Cargo.toml
[package]
name = "demo-app-tauri3"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
description = "The Victauri demo app built against the Tauri 3 pre-release (compatibility canary)"
publish = false

[workspace]

[[bin]]
name = "demo-app-tauri3"
path = "../demo-app/src/main.rs"

[build-dependencies]
tauri-build = "=3.0.0-alpha.4"

[dependencies]
victauri-plugin = { path = "../../crates/victauri-plugin", features = ["tauri-v3"] }
victauri-core = { path = "../../crates/victauri-core" }
tauri = "=3.0.0-alpha.5"
# Tauri 3 apps depend on their webview runtime directly (`Builder::runtime`). Its default
# features include `x11`, which `screenshot` needs on Linux.
tauri-runtime-wry = "=3.0.0-alpha.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = ">=0.32, <0.41", features = ["bundled"] }
# The demo's logging setup (and its `victauri_plugin::log_layer()` line).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
